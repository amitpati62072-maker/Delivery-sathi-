<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delivery Saathi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14213D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Delivery Saathi">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F7;--card:#fff;--ink:#14213D;--mut:#6B7690;--line:#E3E7EE;--acc:#F5A100;--accink:#2B1B00;--ok:#13906A;--bad:#D64545;--nav:#14213D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-t="dark"]{--bg:#0C1424;--card:#16213A;--ink:#EEF1F8;--mut:#93A0BD;--line:#233152;--ok:#3DD6A3;--bad:#FF7A7A;--nav:#0A101D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-t]){--bg:#0C1424;--card:#16213A;--ink:#EEF1F8;--mut:#93A0BD;--line:#233152;--ok:#3DD6A3;--bad:#FF7A7A;--nav:#0A101D}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
h1,h2,.num{font-family:"Baloo 2",system-ui,sans-serif;margin:0}
#app{max-width:520px;margin:0 auto;padding:16px 16px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:"Baloo 2";font-size:26px;line-height:1.1}
.ok{color:var(--ok)}.bad{color:var(--bad)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:var(--accink);font-weight:700}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.s{padding:6px 10px;font-size:13px;border-radius:9px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
label{display:block;font-weight:600;margin:12px 0 6px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;background:transparent;color:var(--mut);padding:9px}
.seg button.on{background:var(--acc);color:var(--accink)}
.step{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}
.step button{width:52px;height:52px;font-size:26px;padding:0}
.step .num{font-size:56px;min-width:90px;text-align:center}
.step input.num{width:130px;height:72px;padding:0;font-size:48px;line-height:1;text-align:center;font-weight:800;-moz-appearance:textfield}
.step input.num::-webkit-outer-spin-button,.step input.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bg)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav div{display:flex;width:100%;max-width:520px}
nav button{flex:1;background:transparent;color:#9AA7C4;padding:8px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px}
nav button span{font-size:21px;line-height:1}
nav button.on{color:#F5A100;background:rgba(245,161,0,.12)}
.hero{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-family:"Baloo 2";font-size:34px;line-height:1}
.login{max-width:420px;margin:0 auto;padding:40px 20px}
.logo{font-size:44px;font-weight:800;line-height:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:9;display:none;font-weight:600;text-align:center;max-width:90%}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
#modal .card{width:100%;max-width:380px;margin:0}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
</style></head><body>
<div id="app"></div><div id="toast"></div><div id="modal"><div class="card" id="mbox"></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,setDoc,collection,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const fbApp=initializeApp(firebaseConfig),auth=getAuth(fbApp),FS=initializeFirestore(fbApp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const T={hi:{home:"Home",del:"Delivery",pick:"Pickup",fuel:"Tel",set:"Setting",today:"Aaj",week:"Hafta",month:"Mahina",earn:"Kamai",delv:"Delivery",pk:"Pickup",fail:"Return",failed:"Return parcel",qty:"Parcel kitne?",add:"Entry jodo",hist:"History",none:"Abhi koi entry nahi",fuelp:"Tel ka hisab",left:"parcel baaki",fuelt:"Tel ka paisa mila",manual:"Tel paisa jodo",rates:"Rate (₹ per parcel)",rd:"Delivery rate",rp:"Pickup rate",rf:"Return rate (0 rakho)",ft:"Din me kam se kam itne parcel par tel milega (din me 1 baar)",fa:"Tel ka paisa (₹)",lang:"Bhasha",theme:"Theme",logout:"Logout",reset:"Sab data mitao",copy:"Report copy karo",edit:"Badlo",del2:"Hatao",save:"Save",cancel:"Cancel",hello:"Namaste",login:"Login",signup:"Naya account",google:"Google se continue karo",email:"Email",pass:"Password",total:"Total kamai",rep:"Report",fuelAdd:"⛽ Tel paisa add hua: ₹",saved:"Save ho gaya",copied:"Report copy ho gayi",auto:"Auto",man:"Manual",sure:"Pakka? Saara data hat jayega.",att:"Attendance",attq:"Aaj ki hazri lagao",pres:"Present",abs:"Absent",pm:"Present (is mahine)",am:"Absent (is mahine)",last7:"Pichhle 7 din (tap karke badlo)",date:"Tareekh",todayb:"Aaj",bon:"Attendance bonus (₹ per parcel, Present din par)",bonl:"Attendance bonus"},
en:{home:"Home",del:"Delivery",pick:"Pickup",fuel:"Fuel",set:"Settings",today:"Today",week:"Week",month:"Month",earn:"Earnings",delv:"Delivered",pk:"Pickups",fail:"Returns",failed:"Failed / Return",qty:"How many parcels?",add:"Add entry",hist:"History",none:"No entries yet",fuelp:"Fuel progress",left:"parcels to go",fuelt:"Fuel money received",manual:"Add fuel money",rates:"Rates (₹ per parcel)",rd:"Delivery rate",rp:"Pickup rate",rf:"Return rate (keep 0)",ft:"Minimum parcels per day for fuel money (once a day)",fa:"Fuel amount (₹)",lang:"Language",theme:"Theme",logout:"Log out",reset:"Erase all data",copy:"Copy report",edit:"Edit",del2:"Delete",save:"Save",cancel:"Cancel",hello:"Hello",login:"Log in",signup:"Sign up",google:"Continue with Google",email:"Email",pass:"Password",total:"Total earnings",rep:"Report",fuelAdd:"⛽ Fuel money added: ₹",saved:"Saved",copied:"Report copied",auto:"Auto",man:"Manual",sure:"Sure? All data will be erased.",att:"Attendance",attq:"Mark today's attendance",pres:"Present",abs:"Absent",pm:"Present (this month)",am:"Absent (this month)",last7:"Last 7 days (tap to change)",date:"Date",todayb:"Today",bon:"Attendance bonus (₹ per parcel, on Present days)",bonl:"Attendance bonus"}};
const $=s=>document.querySelector(s);
let D=null,tab='home',per='today',kind='del',qty=1,mode='login',user=null,edate=null,DB=null,UID=null,UNAME='',pushed={},ptimer=null,cloud=false,syncMsg='';
const KEY=e=>'dp_data_'+e;
const def=()=>({entries:[],fuels:[],counter:0,cfg:{del:10,pick:8,fail:0,bonus:1,target:25,amt:100,lang:'hi',theme:'auto'}});
function sget(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function save(){if(!user)return;sset(KEY(user),D);if(cloud){clearTimeout(ptimer);ptimer=setTimeout(push,500)}}
function split(){const core={cfg:D.cfg,counter:D.counter||0,att:D.att||{}},m={};
 const g=k=>m[k]=m[k]||{entries:[],fuels:[]};D.entries.forEach(e=>g('e_'+dk(new Date(e.ts)).slice(0,7)).entries.push(e));D.fuels.forEach(f=>g('e_'+dk(new Date(f.ts)).slice(0,7)).fuels.push(f));
 Object.keys(pushed).forEach(k=>{if(k.startsWith('e_')&&!m[k])m[k]={entries:[],fuels:[]}});m.core=core;return m}
async function push(){if(!cloud||!UID||!D)return;const m=split();let bad=0;
 for(const k of Object.keys(m)){const j=JSON.stringify(m[k]);if(pushed[k]===j)continue;try{await setDoc(doc(FS,'users',UID,'data',k),JSON.parse(j));pushed[k]=j}catch(e){bad++}}
 syncMsg=bad?'⚠️ Cloud save nahi hua, phir koshish hogi':'☁️ Cloud me save';const el=$('#sy');if(el)el.textContent=syncMsg;if(bad)ptimer=setTimeout(push,5000)}
async function loadCloud(){const snap=await getDocs(collection(FS,'users',UID,'data')),d=def();let any=false;pushed={};
 snap.forEach(x=>{const v=x.data();if(!v)return;any=true;if(x.id==='core'){d.cfg=Object.assign(d.cfg,v.cfg||{});d.counter=v.counter||0;d.att=v.att||{};pushed.core=JSON.stringify({cfg:v.cfg||{},counter:v.counter||0,att:v.att||{}})}
  else if(x.id.startsWith('e_')){d.entries.push(...(v.entries||[]));d.fuels.push(...(v.fuels||[]));pushed[x.id]=JSON.stringify({entries:v.entries||[],fuels:v.fuels||[]})}});
 return any?d:null}
function oldLocal(){let best=null;try{const se=sget('dp_session');if(se&&sget(KEY(se)))return sget(KEY(se));for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('dp_data_')&&true){const v=sget(k);if(v&&(!best||(v.entries||[]).length>(best.entries||[]).length))best=v}}}catch(e){}return best}
const dk=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function setAtt(k,v){D.att=D.att||{};if(v)D.att[k]=v;else delete D.att[k];save();render()}
function attCard(){const a=D.att||{},k=dk(),now=new Date(),mp=dk(now).slice(0,7);let P=0,A=0;Object.keys(a).forEach(x=>{if(x.startsWith(mp)){a[x]==='p'?P++:A++}});
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
 return `<div class="card"><div class="row"><h2>🗓️ ${t('att')}</h2><span class="mut">${t('attq')}</span></div><div class="seg" style="margin:12px 0"><button class="${a[k]==='p'?'on':''}" data-at="${k}|p">✅ ${t('pres')}</button><button class="${a[k]==='a'?'on':''}" data-at="${k}|a">❌ ${t('abs')}</button></div>
 <div class="grid"><div class="stat"><span class="mut">${t('pm')}</span><b class="ok">${P}</b></div><div class="stat"><span class="mut">${t('am')}</span><b class="bad">${A}</b></div></div>
 <div class="mut" style="margin:12px 0 6px">${t('last7')}</div><div class="row" style="gap:4px">${days.map(d=>{const x=dk(d),v=a[x];return `<button class="g s" style="flex:1;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px" data-atc="${x}"><span class="mut" style="font-size:11px">${d.toLocaleDateString('en-IN',{weekday:'short'})}</span><span>${d.getDate()}</span><span>${v==='p'?'✅':v==='a'?'❌':'·'}</span></button>`}).join('')}</div></div>`}
const t=k=>T[D?D.cfg.lang:'hi'][k]||k;
const inr=n=>'₹'+Math.round(n*100)/100;
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.x);toast.x=setTimeout(()=>e.style.display='none',2200)}
function ask(title,val,cb,noInput){const m=$('#modal');$('#mbox').innerHTML=`<h2>${title}</h2>${noInput?'':`<input id="mi" type="number" inputmode="decimal" value="${val}" style="margin:12px 0">`}<div class="row" style="margin-top:12px"><button class="g" style="flex:1" id="mc">${t('cancel')}</button><button style="flex:1" id="mo">OK</button></div>`;m.style.display='flex';
$('#mc').onclick=()=>m.style.display='none';$('#mo').onclick=()=>{const v=noInput?1:parseFloat($('#mi').value);m.style.display='none';if(!isNaN(v))cb(v)};}
function applyTheme(){const r=document.documentElement,th=D?D.cfg.theme:'auto';r.removeAttribute('data-t');r.removeAttribute('data-theme');if(th==='dark')r.setAttribute('data-t','dark');else if(th==='light')r.setAttribute('data-theme','light')}
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(s)}}
function enter(name,data){user=name;D=data||sget(KEY(name))||def();if(D.cfg.bonus==null)D.cfg.bonus=1;applyTheme();tab='home';render()}
let booting=false;
async function onUser(u){if(booting)return;booting=true;
 if(!u){cloud=false;user=null;D=null;UID=null;applyTheme();render();booting=false;return}
 $('#app').innerHTML='<div class="login"><div class="logo">🛵</div><p class="mut">Load ho raha hai…</p></div>';
 try{UID=u.uid;UNAME=u.displayName||u.email||'';let d=await loadCloud(),mig=false;if(!d){d=oldLocal();mig=!!d}cloud=true;user=UID;
  enter(UNAME,d||def());if(mig||!d){D.att=D.att||{};save();push()}}
 catch(e){cloud=false;user=null;render();const er=$('#er');if(er)er.textContent='Data load nahi hua. Internet check karo aur Firebase rules/config dekho. ('+(e.code||e.message)+')'}
 booting=false}
async function googleLogin(){const er=$('#er');if(er)er.textContent='';const p=new GoogleAuthProvider();
 try{await signInWithPopup(auth,p)}catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'||e.code==='auth/web-storage-unsupported'){try{await signInWithRedirect(auth,p)}catch(x){if(er)er.textContent='Login nahi hua: '+(x.code||x.message)}}else if(er&&e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')er.textContent='Login nahi hua: '+(e.code||e.message)}}
onAuthStateChanged(auth,onUser);
/* ---------- logic ---------- */
function addEntry(type,q){const k=edate||dk(),ts=k===dk()?Date.now():new Date(k+'T12:00:00').getTime();D.entries.push({id:Date.now()+Math.random(),type,qty:q,ts});
 checkFuel(k);save();render()}
function todayCount(){const s=startOf('today');return D.entries.filter(e=>e.ts>=s&&e.type!=='fail').reduce((a,e)=>a+e.qty,0)}
function checkFuel(k){k=k||dk();const c=D.cfg,day=ts=>dk(new Date(ts)),n=D.entries.filter(e=>e.type!=='fail'&&day(e.ts)===k).reduce((a,e)=>a+e.qty,0),i=D.fuels.findIndex(f=>f.auto&&day(f.ts)===k);if(n>=c.target&&i<0){D.fuels.push({id:Date.now()+Math.random(),ts:k===dk()?Date.now():new Date(k+'T12:00:00').getTime(),amt:c.amt,auto:true});toast(t('fuelAdd')+c.amt)}else if(n<c.target&&i>=0){D.fuels.splice(i,1)}}
function delEntry(id){const i=D.entries.findIndex(e=>e.id===id);if(i<0)return;const e=D.entries[i];D.entries.splice(i,1);checkFuel(dk(new Date(e.ts)));save();render()}
function editEntry(id){const e=D.entries.find(x=>x.id===id);ask(t('qty'),e.qty,v=>{v=Math.max(1,Math.round(v));e.qty=v;checkFuel(dk(new Date(e.ts)));save();render()})}
const startOf=p=>{const d=new Date();d.setHours(0,0,0,0);if(p==='week')d.setDate(d.getDate()-6);if(p==='month')d.setDate(d.getDate()-29);return d.getTime()};
function sum(p){const s=startOf(p),c=D.cfg;const r={del:0,pick:0,fail:0,fuel:0,bon:0},at=D.att||{};D.entries.filter(e=>e.ts>=s).forEach(e=>{r[e.type]+=e.qty;if(e.type!=='fail'&&at[dk(new Date(e.ts))]==='p')r.bon+=e.qty*c.bonus});D.fuels.filter(f=>f.ts>=s).forEach(f=>r.fuel+=f.amt);r.earn=r.del*c.del+r.pick*c.pick+r.fail*c.fail+r.fuel+r.bon;return r}
const fmt=ts=>{const d=new Date(ts);return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})};
/* ---------- views ---------- */
function ring(){const c=D.cfg,n=todayCount(),p=Math.min(1,n/c.target),C=2*Math.PI*52;return `<div class="ring"><svg width="128" height="128" viewBox="0 0 128 128"><circle cx="64" cy="64" r="52" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="64" cy="64" r="52" fill="none" stroke="var(--acc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*p} ${C}"/></svg><div><b>${n}<span class="mut" style="font-size:16px">/${c.target}</span></b><span class="mut">${n>=c.target?'✅ tel mila':'⛽ aaj'}</span></div></div>`}
function vHome(){const s=sum('today'),r=sum(per),c=D.cfg;
 return `<h1 style="font-size:26px">${t('hello')} 👋</h1><div class="mut" style="margin-bottom:14px">${UNAME}</div>
 <div class="card hero">${ring()}<div><h2>${t('fuelp')}</h2><div class="mut">${Math.max(0,c.target-todayCount())} ${t('left')}</div><div style="margin-top:6px">${t('fuelt')} (${t('today')}): <b class="ok">${inr(sum('today').fuel)}</b></div><div class="mut">${t('month')}: ${inr(sum('month').fuel)}</div></div></div>
 <div class="grid" style="margin-bottom:12px"><div class="stat"><span class="mut">${t('delv')} (${t('today')})</span><b>${s.del}</b></div><div class="stat"><span class="mut">${t('pk')} (${t('today')})</span><b>${s.pick}</b></div><div class="stat"><span class="mut">${t('fail')}</span><b class="bad">${s.fail}</b></div><div class="stat"><span class="mut">${t('earn')} (${t('today')})</span><b class="ok">${inr(s.earn)}</b></div></div>
 ${attCard()}
 <div class="card"><div class="row"><h2>${t('rep')}</h2><div class="seg" style="width:210px">${['today','week','month'].map(p=>`<button class="${per===p?'on':''}" data-per="${p}">${t(p)}</button>`).join('')}</div></div>
 <div class="item"><span>${t('delv')} × ${r.del}</span><b>${inr(r.del*c.del)}</b></div><div class="item"><span>${t('pk')} × ${r.pick}</span><b>${inr(r.pick*c.pick)}</b></div><div class="item"><span>⛽ ${t('fuelt')}</span><b>${inr(r.fuel)}</b></div><div class="item"><span>🗓️ ${t('bonl')}</span><b>${inr(r.bon)}</b></div>
 <div class="item"><b>${t('total')}</b><b class="ok num" style="font-size:24px">${inr(r.earn)}</b></div><button class="g" style="width:100%;margin-top:8px" id="cp">${t('copy')}</button></div>`}
function list(types){const l=D.entries.filter(e=>types.includes(e.type)).sort((a,b)=>b.ts-a.ts).slice(0,40);
 return `<div class="card"><h2>${t('hist')}</h2>${l.length?l.map(e=>`<div class="item"><div><b>${e.qty} parcel</b> ${e.type==='fail'?`<span class="pill bad">${t('fail')}</span>`:''}<div class="mut">${fmt(e.ts)}</div></div><div><button class="g s" data-ed="${e.id}">${t('edit')}</button> <button class="g s bad" data-dl="${e.id}">${t('del2')}</button></div></div>`).join(''):`<p class="mut">${t('none')}</p>`}</div>`}
function vEntry(isDel){const types=isDel?['del','fail']:['pick'];const k=isDel?kind:'pick';
 return `<h1>${isDel?'📦 '+t('del'):'🚚 '+t('pick')}</h1>${isDel?`<div class="seg" style="margin:12px 0"><button class="${k==='del'?'on':''}" data-k="del">${t('delv')}</button><button class="${k==='fail'?'on':''}" data-k="fail">${t('failed')}</button></div>`:''}
 <div class="card"><label style="margin-top:0">📅 ${t('date')}</label><div class="row"><input type="date" id="dt" max="${dk()}" value="${edate||dk()}" aria-label="${t('date')}">${(edate||dk())!==dk()?`<button class="g s" id="dtn">${t('todayb')}</button>`:''}</div><div class="mut" style="text-align:center;margin-top:14px">${t('qty')}</div><div class="step"><button class="g" id="mn">−</button><input class="num" id="qt" type="number" inputmode="numeric" min="1" max="9999" step="1" value="${qty}" aria-label="${t('qty')}"><button id="pl">+</button></div><button style="width:100%" id="ad">${t('add')} · ${inr(qty*D.cfg[k])}</button></div>${list(types)}`}
function vFuel(){const tot=D.fuels.reduce((a,f)=>a+f.amt,0);
 return `<h1>⛽ ${t('fuel')}</h1><div class="card hero" style="margin-top:12px">${ring()}<div><div class="mut">${t('fuelt')}</div><b class="num ok" style="font-size:32px">${inr(tot)}</b><div class="mut">${Math.max(0,D.cfg.target-todayCount())} ${t('left')}</div></div></div><button class="g" style="width:100%;margin-bottom:12px" id="mf">+ ${t('manual')}</button>
 <div class="card"><h2>${t('hist')}</h2>${D.fuels.length?[...D.fuels].reverse().slice(0,40).map(f=>`<div class="item"><div><b class="ok">${inr(f.amt)}</b> <span class="pill">${f.auto?t('auto'):t('man')}</span><div class="mut">${fmt(f.ts)}</div></div><div><button class="g s" data-fe="${f.id}">${t('edit')}</button> <button class="g s bad" data-fd="${f.id}">${t('del2')}</button></div></div>`).join(''):`<p class="mut">${t('none')}</p>`}</div>`}
function vHist(){const c=D.cfg,m={},g=k=>m[k]=m[k]||{del:0,pick:0,fail:0,fuel:0};
 D.entries.forEach(e=>{g(dk(new Date(e.ts)))[e.type]+=e.qty});D.fuels.forEach(f=>{g(dk(new Date(f.ts))).fuel+=f.amt});Object.keys(D.att||{}).forEach(k=>g(k));
 const ks=Object.keys(m).sort().reverse();let all=0;
 const cards=ks.map(k=>{const a=(D.att||{})[k],r=m[k],bn=a==='p'?(r.del+r.pick)*c.bonus:0,e=r.del*c.del+r.pick*c.pick+r.fail*c.fail+r.fuel+bn;all+=e;const d=new Date(k+'T00:00:00');
  return `<div class="card"><div class="row"><b>${d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</b><span>${a==='p'?'✅ '+t('pres'):a==='a'?'❌ '+t('abs'):''}</span></div>
  <div class="grid" style="margin-top:10px"><div class="stat"><span class="mut">${t('delv')}</span><b>${r.del}</b></div><div class="stat"><span class="mut">${t('pk')}</span><b>${r.pick}</b></div><div class="stat"><span class="mut">${t('fail')}</span><b class="bad">${r.fail}</b></div><div class="stat"><span class="mut">⛽ ${t('fuel')}</span><b>${inr(r.fuel)}</b></div></div>
  ${bn?`<div class="item" style="margin-top:8px"><span>🗓️ ${t('bonl')}</span><b>${inr(bn)}</b></div>`:''}<div class="item" style="margin-top:8px"><b>${t('earn')}</b><b class="ok num" style="font-size:22px">${inr(e)}</b></div></div>`}).join('');
 return `<h1>📅 ${t('hist')}</h1><div class="card hero" style="margin-top:12px"><div><div class="mut">${t('total')}</div><b class="num ok" style="font-size:32px">${inr(all)}</b></div></div>${cards||`<div class="card"><p class="mut">${t('none')}</p></div>`}`}
function vSet(){const c=D.cfg,f=(k,l)=>`<label>${l}</label><input type="number" inputmode="decimal" min="0" data-c="${k}" value="${c[k]}">`;
 return `<h1>⚙️ ${t('set')}</h1><div class="card"><h2 style="font-size:18px">${t('rates')}</h2>${f('del',t('rd'))}${f('pick',t('rp'))}${f('fail',t('rf'))}${f('bonus',t('bon'))}</div>
 <div class="card"><h2 style="font-size:18px">⛽ ${t('fuel')}</h2>${f('target',t('ft'))}${f('amt',t('fa'))}</div>
 <div class="card"><label style="margin-top:0">${t('lang')}</label><div class="seg"><button class="${c.lang==='hi'?'on':''}" data-l="hi">Hinglish</button><button class="${c.lang==='en'?'on':''}" data-l="en">English</button></div>
 <label>${t('theme')}</label><div class="seg">${['auto','light','dark'].map(x=>`<button class="${c.theme===x?'on':''}" data-th="${x}">${x}</button>`).join('')}</div></div>
 <div class="card"><div class="mut">☁️ ${UNAME}</div><div class="mut" id="sy" style="margin:4px 0 12px">${syncMsg||'☁️ Cloud me save'}</div><button class="g" style="width:100%" id="lo">${t('logout')}</button></div>`}
function vLogin(){return `<div class="login"><div class="logo">🛵<br>Delivery<br><span style="color:var(--acc)">Saathi</span></div><p class="mut" style="margin:10px 0 22px">Parcel, pickup aur tel ka hisab, ek jagah.</p>
 <button style="width:100%" id="gg">G &nbsp;${T.hi.google}</button>
 <div class="err" id="er"></div>
 <p class="mut" style="margin-top:6px">Apne Google account se login karo. Data aapke account me cloud par save rehta hai, kisi bhi phone se login karo wahi data milega.</p></div>`}
function render(){const a=$('#app');if(!user){a.innerHTML=vLogin();bindLogin();return}
 const tabs=[['home','🏠'],['del','📦'],['pick','🚚'],['fuel','⛽'],['hist','📅'],['set','⚙️']];
 const v={home:vHome,del:()=>vEntry(true),pick:()=>vEntry(false),fuel:vFuel,hist:vHist,set:vSet}[tab]();
 a.innerHTML=v+`<nav><div>${tabs.map(x=>`<button class="${tab===x[0]?'on':''}" data-tab="${x[0]}"><span>${x[1]}</span>${t(x[0])}</button>`).join('')}</div></nav>`;bind()}
function bindLogin(){$('#gg').onclick=googleLogin}
function bind(){const q=(s,f)=>document.querySelectorAll(s).forEach(f);
 q('[data-tab]',b=>b.onclick=()=>{tab=b.dataset.tab;qty=1;edate=null;render();scrollTo(0,0)});
 q('[data-per]',b=>b.onclick=()=>{per=b.dataset.per;render()});
 q('[data-at]',b=>b.onclick=()=>{const[k,v]=b.dataset.at.split('|');setAtt(k,(D.att||{})[k]===v?null:v)});
 q('[data-atc]',b=>b.onclick=()=>{const k=b.dataset.atc,c=(D.att||{})[k];setAtt(k,!c?'p':c==='p'?'a':null)});
 q('[data-k]',b=>b.onclick=()=>{kind=b.dataset.k;render()});
 q('[data-ed]',b=>b.onclick=()=>editEntry(+b.dataset.ed));q('[data-dl]',b=>b.onclick=()=>delEntry(+b.dataset.dl));
 q('[data-fe]',b=>b.onclick=()=>{const f=D.fuels.find(x=>String(x.id)===b.dataset.fe);if(f)ask(t('fa'),f.amt,v=>{f.amt=Math.max(0,v);save();render();toast(t('saved'))})});
 q('[data-fd]',b=>b.onclick=()=>{D.fuels=D.fuels.filter(f=>String(f.id)!==b.dataset.fd);save();render()});
 q('[data-l]',b=>b.onclick=()=>{D.cfg.lang=b.dataset.l;save();render()});q('[data-th]',b=>b.onclick=()=>{D.cfg.theme=b.dataset.th;save();applyTheme();render()});
 q('[data-c]',i=>i.onchange=()=>{let v=parseFloat(i.value);if(isNaN(v)||v<0)v=0;if(i.dataset.c==='target')v=Math.max(1,Math.round(v));D.cfg[i.dataset.c]=v;save();toast(t('saved'))});
 const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
 const qi=$('#qt'),rd=()=>{const v=parseInt(qi&&qi.value,10);return isNaN(v)||v<1?1:Math.min(v,9999)};
 if(qi){qi.oninput=()=>{const v=parseInt(qi.value,10);if(!isNaN(v)&&v>=1){qty=Math.min(v,9999);const k=tab==='pick'?'pick':kind;$('#ad').textContent=t('add')+' · '+inr(qty*D.cfg[k])}};qi.onchange=()=>{qty=rd();render()};qi.onfocus=()=>qi.select()}
 const dt=$('#dt');if(dt)dt.onchange=()=>{let v=dt.value;if(!v||v>dk())v=dk();edate=v;qty=rd();render()};on('#dtn',()=>{edate=null;render()});
 on('#mn',()=>{qty=Math.max(1,rd()-1);render()});on('#pl',()=>{qty=Math.min(9999,rd()+1);render()});
 on('#ad',()=>{const k=tab==='pick'?'pick':kind;qty=rd();const pd=edate&&edate!==dk()?edate:null;addEntry(k,qty);qty=1;if(pd&&$('#toast').style.display!=='block')toast(t('saved')+' · '+pd);render()});
 on('#lo',()=>{signOut(auth)});
 on('#mf',()=>ask(t('manual')+' (₹)',D.cfg.amt,v=>{D.fuels.push({id:Date.now(),ts:Date.now(),amt:v,auto:false});save();render()}));
 on('#cp',()=>{const r=sum(per),c=D.cfg,x=`${t('rep')} (${t(per)})\n${t('delv')}: ${r.del} × ${c.del} = ${inr(r.del*c.del)}\n${t('pk')}: ${r.pick} × ${c.pick} = ${inr(r.pick*c.pick)}\n${t('fail')}: ${r.fail}\n${t('fuelt')}: ${inr(r.fuel)}\n${t('bonl')}: ${inr(r.bon)}\n${t('total')}: ${inr(r.earn)}`;
  try{navigator.clipboard.writeText(x).then(()=>toast(t('copied')),()=>toast(x))}catch(e){toast(x)}})}
$('#app').innerHTML='<div class="login"><div class="logo">🛵</div><p class="mut">Load ho raha hai…</p></div>';
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
