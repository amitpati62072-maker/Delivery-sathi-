<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.item:first-child{border-top:0}

.hero{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-family:"Baloo 2";font-size:34px;line-height:1}
.login{max-width:420px;margin:0 auto;padding:40px 20px}
.logo{font-size:44px;font-weight:800;line-height:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:9;display:none;font-weight:600;text-align:center;max-width:90%}

#modal .card{width:100%;max-width:380px;margin:0}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}

.spl{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);padding:24px;text-align:center;overflow:hidden}
.spl h2{font-size:28px;font-weight:800;margin:26px 0 4px;letter-spacing:.2px}.spl h2 b{color:var(--acc)}
.spl .sub{color:var(--mut);font-size:14px;min-height:20px}

.road{position:relative;width:min(320px,86vw);height:120px}
.road .ground{position:absolute;left:0;right:0;bottom:14px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.road .ground:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--mut) 0 18px,transparent 18px 40px);opacity:.55;animation:sroad .5s linear infinite}
.sc{position:absolute;left:50%;bottom:22px;font-size:62px;line-height:1;transform:translateX(-50%) scaleX(-1);animation:sbump .45s ease-in-out infinite}
.pk{position:absolute;left:50%;bottom:78px;font-size:26px;margin-left:-6px;animation:spk 1.6s ease-in-out infinite}
.ln{position:absolute;height:3px;border-radius:2px;background:var(--acc);opacity:0;animation:sline .9s linear infinite}
.ln.a{top:52px;right:8%;width:46px}.ln.b{top:68px;right:0;width:30px;animation-delay:.3s}.ln.c{top:84px;right:14%;width:38px;animation-delay:.6s}
.bar{width:min(220px,60vw);height:5px;border-radius:3px;background:var(--line);margin-top:22px;overflow:hidden}
.bar:after{content:"";display:block;height:100%;width:40%;border-radius:3px;background:var(--acc);animation:sbar 1.3s ease-in-out infinite}
@keyframes sroad{to{background-position:-40px 0}}

@keyframes sline{0%{transform:translateX(30px);opacity:0}30%{opacity:.8}100%{transform:translateX(-30px);opacity:0}}
@keyframes sbar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@keyframes sdot{0%,80%,100%{opacity:.2}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.spl *,.spl{animation:none!important}}
</style></head><body>
<div id="app"><div class="spl"><div class="road"><span class="pk">📦</span><span class="sc">🛵</span><span class="ln a"></span><span class="ln b"></span><span class="ln c"></span><div class="ground"></div></div><h2>Delivery <b>Saathi</b></h2><div class="sub">Aapka hisab load ho raha hai<i>.</i><i>.</i><i>.</i></div><div class="bar"></div></div></div><div id="toast"></div><div id="modal"><div class="card" id="mbox"></div></div>

en:{entry:"Entry",home:"Home",del:"Delivery",pick:"Pickup",fuel:"Fuel",set:"Settings",today:"Today",week:"Week",month:"Month",earn:"Earnings",delv:"Delivered",pk:"Pickups",fail:"Returns",failed:"Failed / Return",qty:"How many parcels?",add:"Add entry",hist:"History",none:"No entries yet",fuelp:"Fuel progress",left:"parcels to go",fuelt:"Fuel money received",manual:"Add fuel money",rates:"Rates (₹ per parcel)",rd:"Delivery rate",rp:"Pickup rate",rf:"Return rate (keep 0)",ft:"Minimum parcels per day for fuel money (once a day)",fa:"Fuel amount (₹)",lang:"Language",theme:"Theme",logout:"Log out",reset:"Erase all data",copy:"Copy report",edit:"Edit",del2:"Delete",save:"Save",cancel:"Cancel",hello:"Hello",login:"Log in",signup:"Sign up",google:"Continue with Google",email:"Email",pass:"Password",total:"Total earnings",rep:"Report",fuelAdd:"⛽ Fuel money added: ₹",saved:"Saved",copied:"Report copied",auto:"Auto",man:"Manual",sure:"Sure? All data will be erased.",att:"Attendance",attq:"Mark today's attendance",pres:"Present",abs:"Absent",pm:"Present (this month)",am:"Absent (this month)",last7:"Last 7 days (tap to change)",date:"Date",todayb:"Today",bon:"Attendance bonus (₹ per parcel, on Present days)",bonl:"Attendance bonus"}};
const $=s=>document.querySelector(s);
let loginEm='',Q={del:0,pick:0,fail:0},rmonth=null,D=null,tab='home',per='today',kind='del',qty=1,mode='login',user=null,edate=null,DB=null,UID=null,UNAME='',pushed={},ptimer=null,cloud=false,syncMsg='';
const KEY=e=>'dp_data_'+e;

function sget(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}

function save(){if(!user||!cloud)return;clearTimeout(ptimer);ptimer=setTimeout(push,500)}
function split(){const core={cfg:D.cfg,counter:D.counter||0,att:D.att||{}},m={};
 const g=k=>m[k]=m[k]||{entries:[],fuels:[]};D.entries.forEach(e=>g('e_'+dk(new Date(e.ts)).slice(0,7)).entries.push(e));D.fuels.forEach(f=>g('e_'+dk(new Date(f.ts)).slice(0,7)).fuels.push(f));
 Object.keys(pushed).forEach(k=>{if(k.startsWith('e_')&&!m[k])m[k]={entries:[],fuels:[]}});m.core=core;return m}

 for(const k of Object.keys(m)){const j=JSON.stringify(m[k]);if(pushed[k]===j)continue;try{await setDoc(doc(FS,'users',UID,'data',k),JSON.parse(j));pushed[k]=j}catch(e){bad++}}
 syncMsg=bad?'⚠️ Cloud save nahi hua, phir koshish hogi':'☁️ Cloud me save';const el=$('#sy');if(el)el.textContent=syncMsg;if(bad)ptimer=setTimeout(push,5000)}

 snap.forEach(x=>{const v=x.data();if(!v)return;any=true;if(x.id==='core'){d.cfg=Object.assign(d.cfg,v.cfg||{});d.counter=v.counter||0;d.att=v.att||{};pushed.core=JSON.stringify({cfg:v.cfg||{},counter:v.counter||0,att:v.att||{}})}
  else if(x.id.startsWith('e_')){d.entries.push(...(v.entries||[]));d.fuels.push(...(v.fuels||[]));pushed[x.id]=JSON.stringify({entries:v.entries||[],fuels:v.fuels||[]})}});

 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
 return `<div class="card"><div class="row"><h2>🗓️ ${t('att')}</h2><span class="mut">${t('attq')}</span></div><div class="seg" style="margin:12px 0"><button class="${a[k]==='p'?'on':''}" data-at="${k}|p">✅ ${t('pres')}</button><button class="${a[k]==='a'?'on':''}" data-at="${k}|a">❌ ${t('abs')}</button></div>
 <div class="grid"><div class="stat"><span class="mut">${t('pm')}</span><b class="ok">${P}</b></div><div class="stat"><span class="mut">${t('am')}</span><b class="bad">${A}</b></div></div>
 <div class="mut" style="margin:12px 0 6px">${t('last7')}</div><div class="row" style="gap:4px">${days.map(d=>{const x=dk(d),v=a[x];return `<button class="g s" style="flex:1;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px" data-atc="${x}"><span class="mut" style="font-size:11px">${d.toLocaleDateString('en-IN',{weekday:'short'})}</span><span>${d.getDate()}</span><span>${v==='p'?'✅':v==='a'?'❌':'·'}</span></button>`}).join('')}</div></div>`}
const t=k=>T[D?D.cfg.lang:'hi'][k]||k;

function ask(title,val,cb,noInput){const m=$('#modal');$('#mbox').innerHTML=`<h2>${title}</h2>${noInput?'':`<input id="mi" type="number" inputmode="decimal" value="${val}" style="margin:12px 0">`}<div class="row" style="margin-top:12px"><button class="g" style="flex:1" id="mc">${t('cancel')}</button><button style="flex:1" id="mo">OK</button></div>`;m.style.display='flex';
$('#mc').onclick=()=>m.style.display='none';$('#mo').onclick=()=>{const v=noInput?1:parseFloat($('#mi').value);m.style.display='none';if(!isNaN(v))cb(v)};}
function applyTheme(){const r=document.documentElement,th=D?D.cfg.theme:'auto';r.removeAttribute('data-t');r.removeAttribute('data-theme');if(th==='dark')r.setAttribute('data-t','dark');else if(th==='light')r.setAttribute('data-theme','light')}

function ring(){const c=D.cfg,n=todayCount(),p=Math.min(1,n/c.target),C=2*Math.PI*52;return `<div class="ring"><svg width="128" height="128" viewBox="0 0 128 128"><circle cx="64" cy="64" r="52" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="64" cy="64" r="52" fill="none" stroke="var(--acc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*p} ${C}"/></svg><div><b>${n}<span class="mut" style="font-size:16px">/${c.target}</span></b><span class="mut">${n>=c.target?'✅ tel mila':'⛽ aaj'}</span></div></div>`}
